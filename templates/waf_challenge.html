<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>安全验证 - {{ title }}</title>
<style>
body{font-family:"微软雅黑",sans-serif;text-align:center;padding:50px;background:#f5f7fa;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;padding:48px 40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);max-width:420px;width:100%;box-sizing:border-box;}
h1{color:#1a1a2e;font-size:22px;margin:0 0 16px 0;}
.desc{color:#666;font-size:14px;margin-bottom:24px;line-height:1.6;}
.spinner{width:48px;height:48px;border:4px solid #e8ecf1;border-top:4px solid #0066cc;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px auto;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.progress{height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden;margin:16px 0;}
.bar{height:100%;background:linear-gradient(90deg,#0066cc,#0099ff);width:0%;border-radius:3px;transition:width 0.1s;}
.status{color:#888;font-size:13px;}
</style></head>
<body><div class="box">
<h1>安全验证中</h1>
<div class="spinner"></div>
<p class="desc">正在进行安全检查，请稍候...<br>这通常只需要几秒钟</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="status" id="status">初始化...</p>
<script>
(async function(){
  var token = {{ token | tojson }};
  var difficulty = {{ difficulty }};
  var nextUrl = {{ next_url | tojson }};
  var verifyPath = {{ verify_path | tojson }};
  var bar = document.getElementById("bar");
  var status = document.getElementById("status");
  var target = "0".repeat(difficulty);
  var encoder = new TextEncoder();
  var startTime = Date.now();

  function sha256Sync(data) {
    var K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
    function rotr(n,x) { return (x >>> n) | (x << (32-n)); }
    function ch(x,y,z) { return (x & y) ^ (~x & z); }
    function maj(x,y,z) { return (x & y) ^ (x & z) ^ (y & z); }
    function ep0(x) { return rotr(2,x) ^ rotr(13,x) ^ rotr(22,x); }
    function ep1(x) { return rotr(6,x) ^ rotr(11,x) ^ rotr(25,x); }
    function sig0(x) { return rotr(7,x) ^ rotr(18,x) ^ (x >>> 3); }
    function sig1(x) { return rotr(17,x) ^ rotr(19,x) ^ (x >>> 10); }
    var msg = new Uint8Array(data.length + 72);
    msg.set(data);
    msg[data.length] = 0x80;
    var bitLen = data.length * 8;
    for(var i = 0; i < 8; i++) {
      msg[msg.length - 1 - i] = (bitLen >>> (i * 8)) & 0xff;
    }
    var H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    var w = new Uint32Array(64);
    for(var offset = 0; offset < msg.length; offset += 64) {
      for(var t = 0; t < 16; t++) {
        var idx = offset + t * 4;
        w[t] = (msg[idx] << 24) | (msg[idx+1] << 16) | (msg[idx+2] << 8) | msg[idx+3];
        w[t] = w[t] >>> 0;
      }
      for(var t = 16; t < 64; t++) {
        w[t] = (sig1(w[t-2]) + w[t-7] + sig0(w[t-15]) + w[t-16]) >>> 0;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(var t = 0; t < 64; t++) {
        var T1 = (h + ep1(e) + ch(e,f,g) + K[t] + w[t]) >>> 0;
        var T2 = (ep0(a) + maj(a,b,c)) >>> 0;
        h=g; g=f; f=e; e=(d+T1)>>>0; d=c; c=b; b=a; a=(T1+T2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    var hex = "";
    for(var i = 0; i < 8; i++) {
      hex += H[i].toString(16).padStart(8, "0");
    }
    return hex;
  }

  function sha256SyncStr(str) {
    return sha256Sync(encoder.encode(str));
  }

  function submitForm(nonce) {
    bar.style.width = "100%";
    status.textContent = "验证通过，正在跳转...";
    var form = document.createElement("form");
    form.method = "POST";
    form.action = verifyPath + "?next=" + encodeURIComponent(nextUrl);
    var t = document.createElement("input");
    t.type = "hidden"; t.name = "token"; t.value = token;
    form.appendChild(t);
    var n = document.createElement("input");
    n.type = "hidden"; n.name = "nonce"; n.value = nonce;
    form.appendChild(n);
    document.body.appendChild(form);
    form.submit();
  }

  function solveSync(nonceStart) {
    var batchSize = 2000;
    var maxAttempts = difficulty <= 6 ? 100000 : (difficulty <= 8 ? 20000 : 50000);
    var total = nonceStart;
    
    function runBatch() {
      var end = Math.min(total + batchSize, total + maxAttempts - nonceStart);
      var found = -1;
      for(var n = total; n < end; n++) {
        var h = sha256SyncStr(token + ":" + n);
        if(h.substring(0, difficulty) === target) {
          found = n;
          break;
        }
      }
      if(found >= 0) {
        submitForm(found);
        return;
      }
      total = end;
      var progress = Math.min(95, ((total - nonceStart) / maxAttempts) * 100);
      bar.style.width = progress + "%";
      status.textContent = "验证计算中... " + (total - nonceStart) + "次";
      setTimeout(runBatch, 0);
    }
    runBatch();
  }

  function solveWithWorker() {
    var workerCode = [
      "var K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);",
      "function rotr(n,x) { return (x >>> n) | (x << (32-n)); }",
      "function ch(x,y,z) { return (x & y) ^ (~x & z); }",
      "function maj(x,y,z) { return (x & y) ^ (x & z) ^ (y & z); }",
      "function ep0(x) { return rotr(2,x) ^ rotr(13,x) ^ rotr(22,x); }",
      "function ep1(x) { return rotr(6,x) ^ rotr(11,x) ^ rotr(25,x); }",
      "function sig0(x) { return rotr(7,x) ^ rotr(18,x) ^ (x >>> 3); }",
      "function sig1(x) { return rotr(17,x) ^ rotr(19,x) ^ (x >>> 10); }",
      "var encoder = new TextEncoder();",
      "self.onmessage = function(e) {",
      "  var token = e.data.token;",
      "  var difficulty = e.data.difficulty;",
      "  var target = e.data.target;",
      "  var startNonce = e.data.startNonce;",
      "  var batchSize = e.data.batchSize || 5000;",
      "  var maxAttempts = e.data.maxAttempts || 20000;",
      "  var targetBytes = Math.ceil(difficulty / 2);",
      "  var nonce = startNonce;",
      "  function sha256(data) {",
      "    var msg = new Uint8Array(data.length + 72);",
      "    msg.set(data);",
      "    msg[data.length] = 0x80;",
      "    var bitLen = data.length * 8;",
      "    for(var i = 0; i < 8; i++) { msg[msg.length - 1 - i] = (bitLen >>> (i * 8)) & 0xff; }",
      "    var H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);",
      "    var w = new Uint32Array(64);",
      "    for(var offset = 0; offset < msg.length; offset += 64) {",
      "      for(var t = 0; t < 16; t++) { var idx = offset + t * 4; w[t] = (msg[idx] << 24) | (msg[idx+1] << 16) | (msg[idx+2] << 8) | msg[idx+3]; w[t] = w[t] >>> 0; }",
      "      for(var t = 16; t < 64; t++) { w[t] = (sig1(w[t-2]) + w[t-7] + sig0(w[t-15]) + w[t-16]) >>> 0; }",
      "      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];",
      "      for(var t = 0; t < 64; t++) { var T1 = (h + ep1(e) + ch(e,f,g) + K[t] + w[t]) >>> 0; var T2 = (ep0(a) + maj(a,b,c)) >>> 0; h=g; g=f; f=e; e=(d+T1)>>>0; d=c; c=b; b=a; a=(T1+T2)>>>0; }",
      "      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;",
      "      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;",
      "    }",
      "    var hex = ''; for(var i = 0; i < 8; i++) { hex += H[i].toString(16).padStart(8, '0'); } return hex;",
      "  }",
      "  function runBatch() {",
      "    var end = Math.min(nonce + batchSize, startNonce + maxAttempts);",
      "    var found = -1;",
      "    for(var n = nonce; n < end; n++) {",
      "      var h = sha256(encoder.encode(token + ':' + n));",
      "      if(h.substring(0, difficulty) === target) { found = n; break; }",
      "    }",
      "    if(found >= 0) { self.postMessage({found: found, checked: end - startNonce}); return; }",
      "    nonce = end;",
      "    self.postMessage({checked: nonce - startNonce});",
      "    if(nonce < startNonce + maxAttempts) { setTimeout(runBatch, 0); }",
      "    else { self.postMessage({error: 'not_found'}); }",
      "  }",
      "  runBatch();",
      "};"
    ].join("\n");
    var blob = new Blob([workerCode], { type: "text/javascript" });
    var worker = new Worker(URL.createObjectURL(blob));
    var maxAttempts = difficulty <= 6 ? 100000 : (difficulty <= 8 ? 20000 : 50000);
    
    worker.postMessage({
      token: token,
      difficulty: difficulty,
      target: target,
      startNonce: 0,
      batchSize: 5000,
      maxAttempts: maxAttempts
    });
    
    worker.onmessage = function(e) {
      if(e.data.found !== undefined) {
        worker.terminate();
        submitForm(e.data.found);
      } else if(e.data.error) {
        worker.terminate();
        solveSync(0);
      } else {
        var progress = Math.min(95, (e.data.checked / maxAttempts) * 100);
        bar.style.width = progress + "%";
        status.textContent = "验证计算中... " + e.data.checked + "次";
      }
    };
    
    worker.onerror = function() {
      worker.terminate();
      solveSync(0);
    };
  }

  async function solveAsync() {
    var batchSize = 256;
    var maxAttempts = difficulty <= 6 ? 100000 : (difficulty <= 8 ? 20000 : 50000);
    var nonce = 0;
    
    async function runBatch() {
      var end = Math.min(nonce + batchSize, maxAttempts);
      var found = -1;
      for(var n = nonce; n < end; n++) {
        var data = encoder.encode(token + ":" + n);
        var hashBuf = await crypto.subtle.digest("SHA-256", data);
        var hashArr = new Uint8Array(hashBuf);
        var hex = "";
        for(var i = 0; i < hashArr.length; i++) {
          hex += hashArr[i].toString(16).padStart(2, "0");
        }
        if(hex.substring(0, difficulty) === target) {
          found = n;
          break;
        }
      }
      if(found >= 0) {
        submitForm(found);
        return;
      }
      nonce = end;
      var progress = Math.min(95, (nonce / maxAttempts) * 100);
      bar.style.width = progress + "%";
      status.textContent = "验证计算中... " + nonce + "次";
      if(nonce < maxAttempts) {
        setTimeout(runBatch, 50);
      } else {
        solveSync(0);
      }
    }
    runBatch();
  }

  status.textContent = "检测计算环境...";
  
  var supportsCrypto = typeof crypto !== "undefined" && crypto.subtle && typeof crypto.subtle.digest === "function";
  
  if(supportsCrypto) {
    status.textContent = "使用硬件加速计算...";
    try {
      var testData = encoder.encode("test");
      var testHash = await crypto.subtle.digest("SHA-256", testData);
      var testTime = Date.now();
      for(var i = 0; i < 10; i++) { await crypto.subtle.digest("SHA-256", testData); }
      var elapsed = Date.now() - testTime;
      if(elapsed < 500) {
        status.textContent = "快速路径计算中...";
        solveAsync();
      } else {
        status.textContent = "后台计算中...";
        solveWithWorker();
      }
    } catch(e) {
      status.textContent = "使用同步计算...";
      solveSync(0);
    }
  } else {
    status.textContent = "使用安全计算...";
    if(typeof Worker !== "undefined") {
      solveWithWorker();
    } else {
      solveSync(0);
    }
  }
})();
</script></div></body></html>
