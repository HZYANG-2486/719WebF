<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>安全验证 - {{ title }}</title>
<style>
body{font-family:"微软雅黑",sans-serif;text-align:center;padding:50px;background:#f5f7fa;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;padding:48px 40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);max-width:420px;width:100%;box-sizing:border-box;}
h1{color:#1a1a2e;font-size:22px;margin:0 0 16px 0;}
.desc{color:#666;font-size:14px;margin-bottom:24px;line-height:1.6;}
.spinner{width:48px;height:48px;border:4px solid #e8ecf1;border-top:4px solid #0066cc;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px auto;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.progress{height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden;margin:16px 0;}
.bar{height:100%;background:linear-gradient(90deg,#0066cc,#0099ff);width:0%;border-radius:3px;transition:width 0.1s;}
.status{color:#888;font-size:13px;}
</style></head>
<body><div class="box">
<h1>安全验证中</h1>
<div class="spinner"></div>
<p class="desc">正在进行安全检查，请稍候...<br>这通常只需要几秒钟</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="status" id="status">初始化...</p>
<script>
(function(){
  "use strict";

  var token = {{ token | tojson }};
  var difficulty = {{ difficulty }};
  var nextUrl = {{ next_url | tojson }};
  var verifyPath = {{ verify_path | tojson }};
  var bar = document.getElementById("bar");
  var status = document.getElementById("status");
  var target = new Array(difficulty + 1).join("0");
  var submitted = false;

  // ---------------- SHA-256 ----------------
  // 纯 JS 实现（兼容性兜底，不依赖 crypto.subtle / Worker）。
  // 注意填充长度必须是 64 的整数倍：len + 1 + padding + 8 <= n * 64。
  var K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);

  function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
  function ch(x, y, z) { return (x & y) ^ (~x & z); }
  function maj(x, y, z) { return (x & y) ^ (x & z) ^ (y & z); }
  function ep0(x) { return rotr(2, x) ^ rotr(13, x) ^ rotr(22, x); }
  function ep1(x) { return rotr(6, x) ^ rotr(11, x) ^ rotr(25, x); }
  function sig0(x) { return rotr(7, x) ^ rotr(18, x) ^ (x >>> 3); }
  function sig1(x) { return rotr(17, x) ^ rotr(19, x) ^ (x >>> 10); }

  var msgBuf = null;

  function sha256Hex(data) {
    var bitLen = data.length * 8;
    var totalLen = ((data.length + 9 + 63) >> 6) << 6;
    if (!msgBuf || msgBuf.length < totalLen) { msgBuf = new Uint8Array(totalLen); }
    else { msgBuf.fill(0, 0, totalLen); }
    msgBuf.set(data, 0);
    msgBuf[data.length] = 0x80;
    // 长度以小端存放的最后 8 字节（大端写入，低位在末尾）
    var hi = Math.floor(bitLen / 4294967296);
    var lo = bitLen >>> 0;
    msgBuf[totalLen - 8] = (hi >>> 24) & 0xff;
    msgBuf[totalLen - 7] = (hi >>> 16) & 0xff;
    msgBuf[totalLen - 6] = (hi >>> 8) & 0xff;
    msgBuf[totalLen - 5] = hi & 0xff;
    msgBuf[totalLen - 4] = (lo >>> 24) & 0xff;
    msgBuf[totalLen - 3] = (lo >>> 16) & 0xff;
    msgBuf[totalLen - 2] = (lo >>> 8) & 0xff;
    msgBuf[totalLen - 1] = lo & 0xff;

    var H0 = 0x6a09e667, H1 = 0xbb67ae85, H2 = 0x3c6ef372, H3 = 0xa54ff53a;
    var H4 = 0x510e527f, H5 = 0x9b05688c, H6 = 0x1f83d9ab, H7 = 0x5be0cd19;
    var w = new Uint32Array(64);

    for (var offset = 0; offset < totalLen; offset += 64) {
      for (var t = 0; t < 16; t++) {
        var i = offset + t * 4;
        w[t] = ((msgBuf[i] << 24) | (msgBuf[i + 1] << 16) | (msgBuf[i + 2] << 8) | msgBuf[i + 3]) >>> 0;
      }
      for (var t2 = 16; t2 < 64; t2++) {
        w[t2] = (sig1(w[t2 - 2]) + w[t2 - 7] + sig0(w[t2 - 15]) + w[t2 - 16]) >>> 0;
      }
      var a = H0, b = H1, c = H2, d = H3, e = H4, f = H5, g = H6, h = H7;
      for (var t3 = 0; t3 < 64; t3++) {
        var T1 = (h + ep1(e) + ch(e, f, g) + K[t3] + w[t3]) >>> 0;
        var T2 = (ep0(a) + maj(a, b, c)) >>> 0;
        h = g; g = f; f = e; e = (d + T1) >>> 0;
        d = c; c = b; b = a; a = (T1 + T2) >>> 0;
      }
      H0 = (H0 + a) >>> 0; H1 = (H1 + b) >>> 0; H2 = (H2 + c) >>> 0; H3 = (H3 + d) >>> 0;
      H4 = (H4 + e) >>> 0; H5 = (H5 + f) >>> 0; H6 = (H6 + g) >>> 0; H7 = (H7 + h) >>> 0;
    }
    return hx(H0) + hx(H1) + hx(H2) + hx(H3) + hx(H4) + hx(H5) + hx(H6) + hx(H7);
  }

  var HEX = "0123456789abcdef";
  function hx(n) {
    return HEX[(n >>> 28) & 15] + HEX[(n >>> 24) & 15] + HEX[(n >>> 20) & 15] + HEX[(n >>> 16) & 15] +
           HEX[(n >>> 12) & 15] + HEX[(n >>> 8) & 15] + HEX[(n >>> 4) & 15] + HEX[n & 15];
  }

  // 字符串 -> UTF-8 字节（覆盖 0-127 之外的字符）
  function utf8Bytes(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) { out.push(c); }
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return new Uint8Array(out);
  }

  // ---------------- 求解 ----------------
  function verify(nonce) {
    return sha256Hex(utf8Bytes(token + ":" + nonce));
  }

  function submitForm(nonce) {
    if (submitted) { return; }
    // 提交前本地复核一次，避免因计算出错导致验证被拒、又重来一轮
    var h = verify(nonce);
    if (h.substring(0, difficulty) !== target) { return; }
    submitted = true;
    bar.style.width = "100%";
    status.textContent = "验证通过，正在跳转...";
    var form = document.createElement("form");
    form.method = "POST";
    form.action = verifyPath + "?next=" + encodeURIComponent(nextUrl);
    var t = document.createElement("input");
    t.type = "hidden"; t.name = "token"; t.value = token;
    form.appendChild(t);
    var n = document.createElement("input");
    n.type = "hidden"; n.name = "nonce"; n.value = nonce;
    form.appendChild(n);
    document.body.appendChild(form);
    form.submit();
  }

  var MAX_SOLVE_ROUNDS = 3;
  var MAX_NONCE = 4000000;
  var solveRounds = 0;
  try { solveRounds = parseInt(sessionStorage.getItem("waf_solve_rounds") || "0", 10) || 0; } catch (e) {}

  function bumpSolveRound() {
    solveRounds++;
    try { sessionStorage.setItem("waf_solve_rounds", String(solveRounds)); } catch (e) {}
    return solveRounds <= MAX_SOLVE_ROUNDS;
  }

  function showManualContinue() {
    status.textContent = "验证未能在预期时间内完成";
    var box = document.body.querySelector(".box");
    if (!box || box.querySelector(".manual-continue")) { return; }
    var tip = document.createElement("p");
    tip.className = "desc manual-continue";
    tip.textContent = "设备计算较慢，请点击下方按钮继续：";
    box.appendChild(tip);
    var a = document.createElement("a");
    a.href = nextUrl;
    a.textContent = "继续访问";
    a.style.display = "inline-block";
    a.style.padding = "10px 22px";
    a.style.background = "#0066cc";
    a.style.color = "#fff";
    a.style.borderRadius = "6px";
    a.style.textDecoration = "none";
    a.style.fontSize = "14px";
    box.appendChild(a);
  }

  function solve() {
    var nonce = 0;
    var batchSize = 4000;
    var startTime = Date.now();

    function runBatch() {
      if (submitted) { return; }
      var end = Math.min(nonce + batchSize, MAX_NONCE);
      for (var n = nonce; n < end; n++) {
        if (verify(n).substring(0, difficulty) === target) {
          submitForm(n);
          return;
        }
      }
      nonce = end;
      var elapsed = (Date.now() - startTime) / 1000;
      bar.style.width = Math.min(95, (nonce / MAX_NONCE) * 100) + "%";
      status.textContent = "验证计算中... " + nonce + " 次";
      if (nonce >= MAX_NONCE || elapsed > 300) {
        showManualContinue();
        return;
      }
      setTimeout(runBatch, 0);
    }
    runBatch();
  }

  status.textContent = "检测计算环境...";

  // 先自检算法正确性，确保提交的答案一定有效
  var selfTestOk = false;
  try {
    selfTestOk = sha256Hex(utf8Bytes("abc")) ===
      "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad";
  } catch (e) { selfTestOk = false; }

  if (!selfTestOk) {
    status.textContent = "环境异常，正在使用兼容模式...";
    // 极端情况下重新加载一次，让浏览器以其它方式执行
    setTimeout(function () { location.reload(); }, 1500);
  } else if (!bumpSolveRound()) {
    showManualContinue();
  } else {
    solve();
  }
})();
</script></div></body></html>
